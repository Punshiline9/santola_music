<!doctype html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Contacto | Santola Music</title>
    <link
      rel="icon"
      type="image/png"
      href="https://i.postimg.cc/RhnRhFNj/Logo-STP.png"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --verde: #12ad2b;
        --amarelo: #ffdb00;
        --vermelho: #d21034;
        --glass: rgba(255, 255, 255, 0.05);
        --border: rgba(255, 255, 255, 0.12);
        --preto-deep: #080808;
        --transition: all 0.3s ease;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }
      body {
        background-color: var(--preto-deep);
        color: white;
        min-height: 100vh;
      }
      header {
        padding: 1.5rem 1rem;
        text-align: center;
        border-bottom: 1px solid var(--border);
        background: rgba(8, 8, 8, 0.96);
        position: sticky;
        top: 0;
        z-index: 1000;
        backdrop-filter: blur(15px);
      }
      .btn-voltar {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        background: var(--verde);
        color: white;
        padding: 8px 14px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 800;
        font-size: 0.65rem;
        text-transform: uppercase;
        border-bottom: 3px solid #0a6b1a;
        transition: var(--transition);
      }
      .btn-voltar:hover {
        background: white;
        color: black;
        transform: translateY(-50%) scale(1.05);
      }
      .logo-texto {
        font-family: "Syne";
        font-size: 1.6rem;
        font-weight: 800;
        background: linear-gradient(
          to right,
          var(--verde),
          var(--amarelo),
          var(--vermelho)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .main-content {
        max-width: 600px;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      .card {
        background: #111;
        border-radius: 24px;
        padding: 2.5rem;
        border: 1px solid var(--border);
        text-align: center;
      }
      .card h2 {
        font-family: "Syne";
        font-size: 1.8rem;
        color: var(--amarelo);
        margin-bottom: 10px;
      }
      .card p {
        color: #aaa;
        margin-bottom: 2rem;
        font-size: 0.95rem;
      }
      .contact-btn {
        display: block;
        width: 100%;
        margin: 15px 0;
        padding: 16px;
        border-radius: 16px;
        text-decoration: none;
        font-weight: 800;
        font-size: 1rem;
        text-transform: uppercase;
        transition: var(--transition);
      }
      .btn-whatsapp {
        background: #25d366;
        color: white;
        border-bottom: 4px solid #1da851;
      }
      .btn-whatsapp:hover {
        background: #1da851;
        transform: translateY(-2px);
      }
      .btn-email {
        background: var(--glass);
        color: var(--amarelo);
        border: 1px solid var(--amarelo);
      }
      .btn-email:hover {
        background: rgba(255, 219, 0, 0.1);
        transform: translateY(-2px);
      }
      footer {
        text-align: center;
        padding: 3rem 1rem;
        border-top: 1px solid var(--border);
        margin-top: 2rem;
        font-size: 0.75rem;
        opacity: 0.5;
      }
      footer strong {
        color: var(--amarelo);
      }
    </style>
  </head>
  <body>
    <header>
      <a href="index.html" class="btn-voltar">← Voltar</a>
      <div class="logo-texto">Santola Music</div>
    </header>

    <main class="main-content">
      <div class="card">
        <h2>Fala Connosco</h2>
        <p>
          Envia a tua música, sugere parcerias ou reporta algum problema.
          Respondemos rapidamente!
        </p>
        <a
          href="https://wa.me/2399944660?text=Ol%C3%A1%20Santola%20Music!"
          target="_blank"
          class="contact-btn btn-whatsapp"
          >💬 WhatsApp</a
        >
        <a href="mailto:punchiline9@gmail.com" class="contact-btn btn-email"
          >📧 Email</a
        >
      </div>
    </main>

    <footer>
      <p>
        Desenvolvido por <strong>Pacheco Gonçalves</strong><br />Santola Music -
        São Tomé e Príncipe © 2026
      </p>
    </footer>
  </body>
</html>
