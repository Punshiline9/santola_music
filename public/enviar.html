<!doctype html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#080808">
    <meta name="description" content="Envia a tua música para o Santola Music - a maior montra da música de São Tomé e Príncipe.">
    <title>Enviar Música | Santola Music</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/RhnRhFNj/Logo-STP.png">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde: #12ad2b;
            --amarelo: #ffdb00;
            --vermelho: #d21034;
            --preto-deep: #080808;
            --preto-card: #111111;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.12);
            --glow-amarelo: 0 0 20px rgba(255, 219, 0, 0.25);
            --glow-verde: 0 0 20px rgba(18, 173, 43, 0.25);
            --transition-fast: all 0.2s ease;
            --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --cat-kizomba: #1a2a6c;
            --cat-stp: #f09819;
            --cat-angola: #d21034;
            --cat-brazil: #009739;
            --cat-rap: #333;
            --cat-beats: #2f4f4f;
            --cat-semba: #8b4513;
            --cat-mixes: #6a0dad;
            --cat-internacional: #2f4f4f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Inter", sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--preto-deep); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--amarelo); }

        body { background-color: var(--preto-deep); color: white; min-height: 100vh; overflow-x: hidden; line-height: 1.5; }

        header {
            padding: 1.5rem 1rem; text-align: center; border-bottom: 1px solid var(--border);
            background: rgba(8, 8, 8, 0.96); position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px);
        }
        .btn-voltar {
            position: absolute; left: 15px; top: 18px; background: transparent; color: var(--amarelo);
            padding: 8px 14px; border-radius: 8px; text-decoration: none; font-weight: 800; font-size: 0.65rem;
            text-transform: uppercase; border: 1px solid var(--amarelo); transition: var(--transition-fast);
        }
        .btn-voltar:hover { background: rgba(255, 219, 0, 0.1); }
        .logo-main {
            font-family: "Syne"; font-size: 2rem; font-weight: 800;
            background: linear-gradient(to right, var(--verde), var(--amarelo), var(--vermelho));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8)); line-height: 1; cursor: pointer;
            transition: var(--transition-smooth);
        }
        .main-container { max-width: 650px; margin: 3rem auto 5rem; padding: 0 1.2rem; }
        .card-form {
            background: var(--preto-card); border-radius: 28px; padding: 2rem;
            border: 1px solid var(--border); position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .card-form::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 5px;
            background: linear-gradient(to right, var(--verde), var(--amarelo), var(--vermelho));
        }
        .section-title {
            font-family: "Syne"; color: #fff; font-size: 1.5rem; margin-bottom: 1.8rem;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .section-title span { color: var(--amarelo); margin-right: 8px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; color: #aaa; font-size: 0.75rem; font-weight: 600;
            margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; background: var(--glass); border: 1px solid var(--border); color: white;
            padding: 14px 16px; border-radius: 12px; font-size: 0.95rem; outline: none;
            transition: var(--transition-smooth);
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--amarelo); box-shadow: var(--glow-amarelo); background: rgba(255,255,255,0.08);
        }
        .form-group textarea { resize: vertical; min-height: 80px; }

        /* Categorias como botões */
        .cat-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .cat-pill {
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition-fast);
            color: white;
            background: #222;
        }
        .cat-pill:hover { filter: brightness(1.2); }
        .cat-pill.selected { border-color: var(--amarelo); box-shadow: var(--glow-amarelo); }
        .cat-pill[data-cat="cat-kizomba"] { background-color: var(--cat-kizomba); }
        .cat-pill[data-cat="cat-stp"] { background-color: var(--cat-stp); }
        .cat-pill[data-cat="cat-angola"] { background-color: var(--cat-angola); }
        .cat-pill[data-cat="cat-brazil"] { background-color: var(--cat-brazil); }
        .cat-pill[data-cat="cat-rap"] { background-color: var(--cat-rap); }
        .cat-pill[data-cat="cat-beats"] { background-color: var(--cat-beats); }
        .cat-pill[data-cat="cat-semba"] { background-color: var(--cat-semba); }
        .cat-pill[data-cat="cat-mixes"] { background-color: var(--cat-mixes); }
        .cat-pill[data-cat="cat-internacional"] { background-color: var(--cat-internacional); }

        .checkbox-label {
            display: flex; align-items: flex-start; gap: 10px; color: #aaa; font-size: 0.8rem; line-height: 1.4;
        }
        .checkbox-label input[type="checkbox"] { width: auto; margin-top: 2px; accent-color: var(--verde); }
        .btn-enviar {
            width: 100%; background: var(--verde); color: white; padding: 18px; border: none; border-radius: 14px;
            font-weight: 800; font-size: 1rem; text-transform: uppercase; cursor: pointer;
            border-bottom: 4px solid #0a6b1a; transition: var(--transition-smooth); letter-spacing: 1px; margin-top: 10px;
        }
        .btn-enviar:hover { filter: brightness(1.15); transform: translateY(-2px); }
        .btn-enviar:active { transform: translateY(2px); border-bottom-width: 2px; }
        .info-text { text-align: center; margin-top: 20px; font-size: 0.75rem; color: #888; }
        @media (max-width: 600px) {
            .card-form { padding: 1.5rem; }
            .logo-main { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
<header>
    <a href="index.html" class="btn-voltar">← Início</a>
    <div class="logo-main" onclick="window.location.href = 'index.html'">Santola Music</div>
</header>

<main class="main-container">
    <div class="card-form">
        <h2 class="section-title"><span>📤</span> Enviar Música</h2>
        <form id="form-envio">
            <div class="form-group">
                <label>Artista *</label>
                <input type="text" id="artista" required placeholder="Nome do artista ou banda">
            </div>
            <div class="form-group">
                <label>Título *</label>
                <input type="text" id="titulo" required placeholder="Título da música">
            </div>
            <div class="form-group">
                <label>Estilo (categoria) *</label>
                <div class="cat-pills" id="catPills">
                    <div class="cat-pill" data-cat="cat-kizomba" data-value="KIZOMBA_ZOUK">Kizomba & Zouk</div>
                    <div class="cat-pill" data-cat="cat-stp" data-value="TOP_STP">Top STP</div>
                    <div class="cat-pill" data-cat="cat-angola" data-value="TOP_ANGOLA">Top Angola</div>
                    <div class="cat-pill" data-cat="cat-brazil" data-value="TOP_BRAZIL">Top Brazil</div>
                    <div class="cat-pill" data-cat="cat-rap" data-value="RAP_HIPHOP">Rap / Hip-Hop</div>
                    <div class="cat-pill" data-cat="cat-beats" data-value="BEATS_INSTRUMENTAIS">Beats & Instrumentais</div>
                    <div class="cat-pill" data-cat="cat-semba" data-value="SEMBA">Semba</div>
                    <div class="cat-pill" data-cat="cat-mixes" data-value="MELHORES_MIXS">Melhores Mixs</div>
                    <div class="cat-pill" data-cat="cat-internacional" data-value="INTERNACIONAL">Internacional</div>
                </div>
                <select id="categoria" required style="display:none;">
                    <option value="">Escolhe…</option>
                    <option value="KIZOMBA_ZOUK">Kizomba & Zouk</option>
                    <option value="TOP_STP">Top STP</option>
                    <option value="TOP_ANGOLA">Top Angola</option>
                    <option value="TOP_BRAZIL">Top Brazil</option>
                    <option value="RAP_HIPHOP">Rap / Hip-Hop</option>
                    <option value="BEATS_INSTRUMENTAIS">Beats & Instrumentais</option>
                    <option value="SEMBA">Semba</option>
                    <option value="MELHORES_MIXS">Melhores Mixs</option>
                    <option value="INTERNACIONAL">Internacional</option>
                </select>
            </div>
            <div class="form-group">
                <label>🔗 Link da música (MP3)</label>
                <input type="url" id="audio_link" placeholder="https://drive.google.com/... ou https://mediafire.com/...">
            </div>
            <div class="form-group">
                <label>📁 OU Enviar ficheiro MP3</label>
                <input type="file" id="audio_file" accept="audio/mp3, audio/mpeg">
            </div>
            <div class="form-group">
                <label>Descrição (opcional)</label>
                <textarea id="descricao" placeholder="Fala um pouco sobre a música..."></textarea>
            </div>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="confirma-direitos" required>
                    <span>Declaro que detenho os direitos de autor ou autorização legal para divulgar esta música no <strong>Santola Music</strong>. Compreendo que conteúdos protegidos sem permissão serão removidos.</span>
                </label>
            </div>
            <button type="submit" class="btn-enviar">Enviar para Aprovação</button>
        </form>
        <p class="info-text">A tua música ficará pendente até ser aprovada por Pacheco Gonçalves. Obrigado!</p>
    </div>
</main>

<script>
    // ⚡ API BASE
    const API_BASE = "https://script.google.com/macros/s/AKfycbzkBjnZOH-EX1DNHWM8smzE0wxl1liv6dY5fazOY-MTJO49I4BTNIAZnc-tvIw5F61W/exec";

    // Gerir seleção das categorias pelos botões
    const pills = document.querySelectorAll('.cat-pill');
    const selectCategoria = document.getElementById('categoria');

    pills.forEach(pill => {
        pill.addEventListener('click', function () {
            pills.forEach(p => p.classList.remove('selected'));
            this.classList.add('selected');
            selectCategoria.value = this.getAttribute('data-value');
        });
    });

    document.getElementById("form-envio").addEventListener("submit", async (e) => {
        e.preventDefault();

        const artista = document.getElementById("artista").value.trim();
        const titulo = document.getElementById("titulo").value.trim();
        const categoria = selectCategoria.value;
        const audio_link = document.getElementById("audio_link").value.trim();
        const descricao = document.getElementById("descricao").value.trim();
        const direitosConfirmados = document.getElementById("confirma-direitos").checked;
        const fileInput = document.getElementById("audio_file");
        const file = fileInput.files[0];

        if (!categoria) {
            alert("Por favor, escolhe um estilo.");
            return;
        }

        if (!audio_link && !file) {
            alert("Fornece um link da música ou seleciona um ficheiro MP3.");
            return;
        }

        const payload = {
            action: "receber_musica",
            artista,
            titulo,
            categoria,
            descricao,
            direitos_confirmados: direitosConfirmados
        };

        // Se houver ficheiro, converte para base64
        if (file) {
            try {
                const base64 = await fileToBase64(file);
                payload.musicaBase64 = base64.split(",")[1];      // remove o prefixo data:...
                payload.musicaMime = file.type;
                payload.audio_link = "";                           // o backend dará prioridade ao ficheiro
            } catch (err) {
                alert("Erro ao ler o ficheiro.");
                return;
            }
        } else {
            payload.audio_link = audio_link;
        }

        try {
            const resposta = await fetch(API_BASE, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const resultado = await resposta.json();
            if (resultado.status === "sucesso") {
                alert("Música enviada com sucesso! Aguarda a aprovação.");
                document.getElementById("form-envio").reset();
                // Limpar seleção dos botões
                pills.forEach(p => p.classList.remove('selected'));
                selectCategoria.value = "";
            } else {
                alert("Erro: " + resultado.mensagem);
            }
        } catch (err) {
            alert("Falha na ligação ao servidor. Tenta novamente mais tarde.");
            console.error(err);
        }
    });

    // Função auxiliar para converter ficheiro em base64
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }
</script>
</body>
</html>
